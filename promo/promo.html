<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#ff3d87; --pink-soft:#ffd7e5; --pink-bg:#fdeaf1;
  --ink:#2b2030; --ink-soft:#6f6076; --yellow:#ffd93d; --blue:#cfe2ff;
}
html,body{width:1080px;height:1350px;overflow:hidden}
body{
  font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;
  background:var(--pink-bg); color:var(--ink);
  position:relative; padding:60px 58px;
  display:flex; flex-direction:column;
}
.stripes{position:absolute;inset:0;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.6) 0 4px,transparent 4px 30px)}
.b1{position:absolute;width:620px;height:620px;border-radius:50%;background:rgba(255,186,212,.5);top:-215px;right:-190px}
.b2{position:absolute;width:430px;height:430px;border-radius:50%;background:rgba(255,226,110,.42);bottom:-160px;left:-150px}
.z{position:relative;z-index:2;display:flex;flex-direction:column;height:100%}

.badge{
  display:inline-flex;align-items:center;gap:14px;background:var(--ink);color:#fff;
  padding:15px 32px;border-radius:999px;font-size:30px;font-weight:800;letter-spacing:-.03em;
  align-self:flex-start;
}
.badge i{width:15px;height:15px;border-radius:50%;background:#3ddc84;display:block}

h1{margin-top:24px;font-size:116px;font-weight:900;letter-spacing:-.055em;line-height:.99}
h1 .p{color:var(--pink);display:block}

.sub{margin-top:28px;font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1.4}
.sub .hl{background:linear-gradient(var(--pink-soft),var(--pink-soft));background-size:100% 20px;background-position:0 82%;background-repeat:no-repeat;padding:0 6px}

.mock{
  margin-top:34px;background:#fff;border-radius:36px;padding:34px 34px 38px;
  box-shadow:0 20px 50px rgba(180,60,110,.13);
}
.mh{display:flex;align-items:baseline;gap:17px;padding-bottom:20px;border-bottom:3px solid #f3eaef}
.mh b{font-size:35px;font-weight:900;letter-spacing:-.04em}
.mh s{font-size:30px;font-weight:800;color:#c2b1bd;text-decoration:none}
.msg{display:flex;gap:19px;align-items:flex-start;margin-top:24px}
.av{width:64px;height:64px;border-radius:22px;flex:0 0 auto}
.ap{background:var(--pink-soft)} .ab{background:var(--blue)}
.bub{background:#f2eef2;border-radius:26px;padding:17px 30px;font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:1.35}
.me{justify-content:flex-end;margin-top:26px}
.bme{background:var(--yellow);font-weight:900}

.spacer{flex:1;min-height:26px}

.dark{
  background:var(--ink);color:#fff;border-radius:34px;padding:34px 40px;text-align:center;
}
.dl{flex:0 0 auto}
.dl s{display:block;font-size:31px;font-weight:900;color:var(--pink);letter-spacing:-.03em;text-decoration:none}
.dl b{display:block;font-size:58px;font-weight:900;letter-spacing:-.04em;line-height:1.18;margin-top:2px}
.dv{width:3px;align-self:stretch;background:rgba(255,255,255,.22)}
.dr{font-size:36px;font-weight:800;letter-spacing:-.035em;line-height:1.45}
.dr em{font-style:normal;color:var(--yellow)}
.fee{display:inline-block;margin-top:12px;background:rgba(255,255,255,.14);border-radius:999px;padding:9px 22px;font-size:30px;font-weight:900;letter-spacing:-.03em}

.chips{display:flex;gap:14px;margin-top:20px;justify-content:center}
.chip{
  background:rgba(255,255,255,.85);border:3px solid #f4dde7;border-radius:999px;
  padding:16px 26px;font-size:27px;font-weight:800;letter-spacing:-.035em;
}
.chip.no{color:#d62d74;border-color:var(--pink-soft)}
</style>
</head>
<body>
<div class="stripes"></div><div class="b1"></div><div class="b2"></div>

<div class="z">
  <div class="badge"><i></i>전국 대학생 누구나</div>

  <h1>전국대학<span class="p">미팅단톡</span></h1>

  <p class="sub">
    과팅·미팅 <span class="hl">품앗이 단톡방</span> 열었어요<br>
    한 명 대타 급할 때도 여기로!
  </p>

  <div class="mock">
    <div class="mh"><b>전국대학 미팅단톡</b></div>
    <div class="msg"><div class="av ap"></div><div class="bub">2:2 오늘 저녁 가능한 분?</div></div>
    <div class="msg"><div class="av ab"></div><div class="bub">저희과 3명 대기중이요!</div></div>
    <div class="msg me"><div class="bub bme">한 명만 대타 구해요 🙏</div></div>
  </div>

  <div class="spacer"></div>

  <div class="dark">
    <div class="dr">신청서 작성하면 <em>문자로 링크</em>를 보내드려요<br><span class="fee">여학우 무료 · 남학우 5,000원</span></div>
  </div>

  <div class="chips">
    <span class="chip">대학생만</span>
    <span class="chip no">정치·종교 X</span>
    <span class="chip no">이상하면 바로 강퇴</span>
  </div>
</div>
</body>
</html>
