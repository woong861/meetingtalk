<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;overflow:hidden}
body{font-family:Pretendard,sans-serif;background:#241a2b;color:#fff;padding:74px 66px;display:flex;flex-direction:column;position:relative}
.glow{position:absolute;border-radius:50%;filter:blur(90px)}
.g1{width:520px;height:520px;background:rgba(255,45,126,.55);top:-140px;right:-120px}
.g2{width:400px;height:400px;background:rgba(255,217,61,.25);bottom:-160px;left:-140px}
.z{position:relative;z-index:2;display:flex;flex-direction:column;height:100%}
.q{font-size:96px;font-weight:900;letter-spacing:-.06em;line-height:1.14}
.q .hl{color:#ff5f9e}
.line{width:96px;height:8px;background:#ffd93d;border-radius:99px;margin:38px 0 30px}
.body{font-size:38px;font-weight:600;letter-spacing:-.04em;line-height:1.62;color:#e6d9e4}
.body b{color:#fff;font-weight:800}
.spacer{flex:1;min-height:20px}
.cta{background:#ff2d7e;border-radius:26px;padding:30px;text-align:center;box-shadow:0 18px 40px rgba(255,45,126,.35)}
.cta .u{font-size:48px;font-weight:900;letter-spacing:-.02em}
.cta .s{margin-top:10px;font-size:27px;font-weight:700;letter-spacing:-.03em;color:#ffe0ee}
.tag{margin-top:22px;text-align:center;font-size:27px;font-weight:700;color:#9b8aa0;letter-spacing:-.03em}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="z">
  <div class="q">미팅 한 번 하기가<br>왜 이렇게<br><span class="hl">힘든지</span></div>
  <div class="line"></div>
  <div class="body">
    과에 남자만 있거나 여자만 있으면 답 없고<br>
    아는 선배 통해야 겨우 한 번 잡히고<br>
    같은 학교끼리 하면 소문 다 나고<br><br>
    그래서 <b>전국 단톡방</b> 하나 팠어요
  </div>
  <div class="spacer"></div>
  <div class="cta">
    <div class="u">meetingtalk.cloud</div>
    <div class="s">신청 1분 · 확인되는 대로 바로 문자</div>
  </div>
  <div class="tag">여자 무료 · 남자 5,000원 · 대학생만</div>
</div>
</body></html>
