<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--pink:#ff3d87;--pink-soft:#ffd7e5;--bg:#fdeaf1;--ink:#2b2030;--yellow:#ffd93d;--blue:#cfe2ff}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;
  background:var(--bg);color:var(--ink);position:relative;
  display:flex;align-items:center;gap:56px;padding:0 72px;
}
.stripes{position:absolute;inset:0;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.6) 0 4px,transparent 4px 30px)}
.b1{position:absolute;width:520px;height:520px;border-radius:50%;background:rgba(255,186,212,.5);top:-190px;right:-140px}
.b2{position:absolute;width:340px;height:340px;border-radius:50%;background:rgba(255,226,110,.4);bottom:-150px;left:-120px}
.z{position:relative;z-index:2;display:flex;align-items:center;gap:56px;width:100%}

.left{flex:1}
.badge{display:inline-flex;align-items:center;gap:11px;background:var(--ink);color:#fff;padding:12px 26px;border-radius:999px;font-size:24px;font-weight:700;letter-spacing:-.03em}
.badge i{width:12px;height:12px;border-radius:50%;background:#3ddc84;display:block}
h1{margin-top:24px;font-size:104px;font-weight:900;letter-spacing:-.055em;line-height:1.0}
h1 .p{color:var(--pink);display:block}
.sub{margin-top:24px;font-size:31px;font-weight:700;letter-spacing:-.04em;line-height:1.45;color:#5d4f63}
.sub b{color:var(--ink)}

.mock{flex:0 0 430px;background:#fff;border-radius:32px;padding:32px 30px 34px;box-shadow:0 22px 50px rgba(180,60,110,.16)}
.mh{font-size:25px;font-weight:800;letter-spacing:-.04em;padding-bottom:18px;border-bottom:2px solid #f3eaef}
.msg{display:flex;gap:15px;align-items:flex-start;margin-top:22px}
.av{width:50px;height:50px;border-radius:17px;flex:0 0 auto}
.ap{background:var(--pink-soft)}.ab{background:var(--blue)}
.bub{background:#f2eef2;border-radius:20px;padding:14px 22px;font-size:25px;font-weight:600;letter-spacing:-.04em;line-height:1.35}
.me{justify-content:flex-end;margin-top:20px}
.bme{background:var(--yellow);font-weight:800}
</style>
</head>
<body>
<div class="stripes"></div><div class="b1"></div><div class="b2"></div>
<div class="z">
  <div class="left">
    <div class="badge"><i></i>전국 대학생 누구나</div>
    <h1>전국대학<span class="p">미팅단톡</span></h1>
    <p class="sub">과팅·미팅 <b>품앗이 단톡방</b><br>한 명 대타 급할 때도 여기로!</p>
  </div>
  <div class="mock">
    <div class="mh">전국대학 미팅단톡</div>
    <div class="msg"><div class="av ap"></div><div class="bub">2:2 오늘 저녁<br>가능한 분?</div></div>
    <div class="msg"><div class="av ab"></div><div class="bub">저희과 3명<br>대기중이요!</div></div>
    <div class="msg me"><div class="bub bme">한 명만 대타 구해요</div></div>
  </div>
</div>
</body>
</html>
