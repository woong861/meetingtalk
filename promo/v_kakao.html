<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;overflow:hidden}
body{font-family:Pretendard,sans-serif;background:#b2c7d9;display:flex;flex-direction:column}
.top{background:#a3b8c9;padding:26px 30px;display:flex;align-items:center;gap:18px;flex:0 0 auto}
.top .back{font-size:38px;color:#2b2b2b;font-weight:300}
.top .t{font-size:34px;font-weight:800;color:#1a1a1a;letter-spacing:-.04em}
.chat{flex:1;padding:26px 30px;display:flex;flex-direction:column;gap:20px;overflow:hidden}
.row{display:flex;gap:16px;align-items:flex-start}
.av{width:66px;height:66px;border-radius:22px;flex:0 0 auto;background:#fff}
.av.p{background:#ffd0e0}.av.b{background:#cfe2ff}.av.y{background:#ffe9a8}
.wrap{max-width:640px}
.nm{font-size:24px;color:#4a4a4a;font-weight:600;margin-bottom:8px;letter-spacing:-.03em}
.bub{background:#fff;border-radius:6px 20px 20px 20px;padding:20px 26px;font-size:34px;font-weight:600;letter-spacing:-.04em;line-height:1.4;color:#111;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.row.me{justify-content:flex-end}
.row.me .bub{background:#fae100;border-radius:20px 6px 20px 20px}
.foot{flex:0 0 auto;background:#241a2b;padding:30px;text-align:center}
.foot .a{font-size:33px;font-weight:800;color:#fff;letter-spacing:-.04em}
.foot .b{margin-top:12px;font-size:40px;font-weight:900;color:#ffd93d;letter-spacing:-.02em}
.foot .c{margin-top:12px;font-size:26px;font-weight:700;color:#c9b8c6;letter-spacing:-.03em}
</style></head><body>
<div class="top"><span class="back">‹</span><span class="t">전국대학 미팅단톡</span></div>
<div class="chat">
  <div class="row"><div class="av p"></div><div class="wrap"><div class="nm">홍대 22</div><div class="bub">2:2 오늘 저녁 되는 분?</div></div></div>
  <div class="row"><div class="av b"></div><div class="wrap"><div class="nm">건대 21</div><div class="bub">저희과 3명인데<br>3:3 하실 팀 구해요</div></div></div>
  <div class="row me"><div class="wrap"><div class="bub">한 명 펑크나서<br>대타 급구요 🙏</div></div></div>
  <div class="row"><div class="av y"></div><div class="wrap"><div class="nm">중대 23</div><div class="bub">저요저요 카톡 드릴게요</div></div></div>
  <div class="row"><div class="av p"></div><div class="wrap"><div class="nm">경희대 22</div><div class="bub">이번 주말 2:2도 구해요!</div></div></div>
</div>
<div class="foot">
  <div class="a">전국 대학생 미팅 단톡방</div>
  <div class="b">meetingtalk.cloud</div>
  <div class="c">여자 무료 · 남자 5,000원 · 신청 1분</div>
</div>
</body></html>
