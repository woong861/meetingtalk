<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;overflow:hidden}
body{font-family:Pretendard,sans-serif;background:linear-gradient(155deg,#fff5f9 0%,#ffe9f2 55%,#ffd9e8 100%);color:#241a2b;padding:62px 58px;display:flex;flex-direction:column;position:relative}
.b{position:absolute;border-radius:50%}
.b1{width:460px;height:460px;background:rgba(255,45,126,.10);top:-160px;right:-130px}
.b2{width:320px;height:320px;background:rgba(255,217,61,.28);bottom:-130px;left:-110px}
.z{position:relative;z-index:2;display:flex;flex-direction:column;height:100%}
.tag{align-self:flex-start;background:#241a2b;color:#fff;padding:12px 27px;border-radius:999px;font-size:27px;font-weight:800;letter-spacing:-.03em}
h1{margin-top:24px;font-size:110px;font-weight:900;letter-spacing:-.06em;line-height:1.02}
h1 .p{color:#ff2d7e}
.sub{margin-top:22px;font-size:35px;font-weight:700;letter-spacing:-.04em;line-height:1.5;color:#6f5f75}
.list{margin-top:34px;display:flex;flex-direction:column;gap:14px}
.i{background:#fff;border-radius:20px;padding:22px 28px;display:flex;align-items:center;gap:20px;box-shadow:0 6px 18px rgba(180,60,110,.08)}
.i .c{width:44px;height:44px;border-radius:50%;background:#e9fbf1;color:#0a8f4f;display:grid;place-items:center;font-size:26px;font-weight:900;flex:0 0 auto}
.i .t{font-size:33px;font-weight:800;letter-spacing:-.04em}
.note{margin-top:22px;font-size:27px;font-weight:700;color:#8a7a90;letter-spacing:-.03em;text-align:center}
.url{margin-top:auto;background:#241a2b;border-radius:24px;padding:28px;text-align:center}
.url .u{font-size:46px;font-weight:900;color:#fff;letter-spacing:-.02em}
.url .u .y{color:#ffd93d}
.url .s{margin-top:9px;font-size:26px;font-weight:700;color:#c0aec0;letter-spacing:-.03em}
</style></head><body>
<div class="b b1"></div><div class="b b2"></div>
<div class="z">
  <div class="tag">전국 대학생 소개팅·미팅</div>
  <h1>여학우는<br><span class="p">전부 무료</span></h1>
  <p class="sub">소개팅도, 미팅도, 단톡방도<br>돈 안 내셔도 돼요</p>
  <div class="list">
    <div class="i"><div class="c">✓</div><div class="t">1:1 소개팅 — 무료</div></div>
    <div class="i"><div class="c">✓</div><div class="t">2:2 · 3:3 미팅 — 무료</div></div>
    <div class="i"><div class="c">✓</div><div class="t">전국 미팅 단톡방 — 무료</div></div>
  </div>
  <div class="note">남학우는 소개팅 16,000원 · 미팅 8,000원</div>
  <div class="url"><div class="u">meetingtalk<span class="y">.cloud</span></div><div class="s">신청 1분 · 확인되는 대로 바로 문자</div></div>
</div>
</body></html>
