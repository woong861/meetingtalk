<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;overflow:hidden}
body{font-family:Pretendard,sans-serif;background:#241a2b;color:#fff;padding:66px 60px;display:flex;flex-direction:column;position:relative}
.glow{position:absolute;border-radius:50%;filter:blur(90px)}
.g1{width:540px;height:540px;background:rgba(255,45,126,.5);top:-160px;right:-140px}
.g2{width:380px;height:380px;background:rgba(255,217,61,.22);bottom:-150px;left:-130px}
.z{position:relative;z-index:2;display:flex;flex-direction:column;height:100%}
.tag{align-self:flex-start;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);padding:12px 26px;border-radius:999px;font-size:27px;font-weight:800;letter-spacing:-.03em}
h1{margin-top:26px;font-size:104px;font-weight:900;letter-spacing:-.06em;line-height:1.06}
h1 .y{color:#ffd93d}
.sub{margin-top:24px;font-size:36px;font-weight:600;letter-spacing:-.04em;line-height:1.55;color:#dcccda}
.sub b{color:#fff;font-weight:800}
.price{margin-top:auto;display:flex;flex-direction:column;gap:13px}
.p{background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.16);border-radius:20px;padding:22px 28px;display:flex;align-items:center;justify-content:space-between}
.p .l{font-size:32px;font-weight:800;letter-spacing:-.04em}
.p .r{font-size:30px;font-weight:900;letter-spacing:-.03em}
.p .r .f{color:#7dfcb0}
.p .r .m{color:#ffd0e4}
.url{margin-top:20px;background:#ff2d7e;border-radius:24px;padding:28px;text-align:center;box-shadow:0 16px 36px rgba(255,45,126,.34)}
.url .u{font-size:46px;font-weight:900;letter-spacing:-.02em}
.url .s{margin-top:8px;font-size:26px;font-weight:700;color:#ffe0ee;letter-spacing:-.03em}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="z">
  <div class="tag">전국 대학생 소개팅·미팅</div>
  <h1>미팅 상대<br><span class="y">찾아드릴게요</span></h1>
  <p class="sub">직접 구하러 다니지 않아도 돼요<br>학교·나이·취향 보고 <b>운영진이 직접 연결</b></p>
  <div class="price">
    <div class="p"><span class="l">1:1 소개팅</span><span class="r"><span class="f">여 무료</span> · <span class="m">남 16,000</span></span></div>
    <div class="p"><span class="l">2:2 · 3:3 미팅</span><span class="r"><span class="f">여 무료</span> · <span class="m">남 8,000</span></span></div>
    <div class="p"><span class="l">전국 미팅 단톡방</span><span class="r"><span class="f">남녀 모두 무료</span></span></div>
  </div>
  <div class="url"><div class="u">meetingtalk.cloud</div><div class="s">신청 1분 · 확인되는 대로 바로 문자</div></div>
</div>
</body></html>
