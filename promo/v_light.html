<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;overflow:hidden}
body{font-family:Pretendard,sans-serif;background:#fff;color:#241a2b;padding:52px 54px;display:flex;flex-direction:column}
.tag{align-self:flex-start;background:#fff0f6;color:#ff2d7e;border:3px solid #ffd0e4;padding:11px 24px;border-radius:999px;font-size:26px;font-weight:800;letter-spacing:-.03em}
h1{margin-top:20px;font-size:80px;font-weight:900;letter-spacing:-.06em;line-height:1.08}
h1 .p{color:#ff2d7e}
.sub{margin-top:16px;font-size:30px;font-weight:700;letter-spacing:-.04em;color:#7a6b80;line-height:1.5}
.cards{margin-top:28px;display:flex;flex-direction:column;gap:13px}
.c{background:#faf7fa;border:3px solid #f0e8ef;border-radius:20px;padding:19px 24px;display:flex;align-items:center;gap:20px}
.c .n{width:46px;height:46px;border-radius:14px;background:#ff2d7e;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:900;flex:0 0 auto}
.c .t{font-size:29px;font-weight:800;letter-spacing:-.04em}
.c .t s{display:block;font-size:23px;font-weight:600;color:#8a7a90;text-decoration:none;margin-top:5px;letter-spacing:-.03em}
.spacer{flex:1;min-height:16px}
.fee{display:flex;gap:14px}
.fee div{flex:1;border-radius:18px;padding:18px;text-align:center;font-size:28px;font-weight:900;letter-spacing:-.04em}
.fee .f{background:#e9fbf1;color:#0a8f4f;border:3px solid #c3edd6}
.fee .m{background:#fff0f6;color:#d61a6b;border:3px solid #ffd0e4}
.url{margin-top:13px;background:#241a2b;color:#fff;border-radius:20px;padding:22px;text-align:center;font-size:37px;font-weight:900;letter-spacing:-.02em}
.url .y{color:#ffd93d}
</style></head><body>
<div class="tag">● 전국 대학생 누구나</div>
<h1>미팅 구할 데<br>없을 때 <span class="p">여기로</span></h1>
<p class="sub">2:2, 3:3, 한 명 대타까지<br>전국 대학생 미팅 단톡방</p>
<div class="cards">
  <div class="c"><div class="n">1</div><div class="t">신청서 작성<s>이름·성별·학교·나이·번호·인스타 · 1분</s></div></div>
  <div class="c"><div class="n">2</div><div class="t">문자로 링크 받기<s>확인되는 대로 바로 보내드려요</s></div></div>
  <div class="c"><div class="n">3</div><div class="t">단톡방에서 구하기<s>남자방 여자방 따로 운영</s></div></div>
</div>
<div class="spacer"></div>
<div class="fee"><div class="f">여자 무료</div><div class="m">남자 5,000원</div></div>
<div class="url">meetingtalk<span class="y">.cloud</span></div>
</body></html>
